name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-pink.svg?color_snake=#F472B6&color_dots=#161B22,#4A1D33,#831843,#DB2777,#F9A8D4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
